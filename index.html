<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ateliê · Sistema de apoio a macrameiras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="app"><div class="carregando">Carregando...</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/calc.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/projetos.js"></script>
  <script src="assets/propostas.js"></script>
  <script src="assets/financeiro.js"></script>
  <script src="assets/pecas.js"></script>
  <script src="assets/insights.js"></script>
  <script src="assets/assistente.js"></script>
  <script>
    // Diagnóstico: se algum arquivo não carregou, mostra o motivo em vez de tela em branco.
    (function () {
      var faltando = [];
      if (!window.supabase) faltando.push('vendor/supabase.js');
      if (!window.APP_CONFIG) faltando.push('assets/config.js');
      if (!window.__APP_OK__) faltando.push('assets/app.js');
      if (!window.Calc) faltando.push('assets/calc.js');
      if (!window.App || !window.App.paginas.projeto) faltando.push('assets/projetos.js');
      if (!window.App || !window.App.paginas.proposta) faltando.push('assets/propostas.js');
      if (!window.App || !window.App.paginas.assistente) faltando.push('assets/assistente.js');
      if (!window.App || !window.App.paginas.financeiro) faltando.push('assets/financeiro.js');
      if (!window.App || !window.App.paginas.pecas) faltando.push('assets/pecas.js');
      if (!window.App || !window.App.paginas.insights) faltando.push('assets/insights.js');
      if (!faltando.length) return;
      document.getElementById('app').innerHTML =
        '<div style="max-width:560px;margin:60px auto;padding:24px;font-family:sans-serif;background:#fcebeb;color:#a32d2d;border-radius:10px">' +
        '<strong>O sistema não conseguiu abrir.</strong><br><br>Estes arquivos não foram encontrados no endereço certo:<br><code>' +
        faltando.join('<br>') + '</code><br><br>Confira no GitHub se eles estão dentro das pastas com esses nomes (e não soltos na raiz).</div>';
    })();
  </script>
</body>
</html>
